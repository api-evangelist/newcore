name: NewCore
description: >-
  NewCore is an enterprise identity-security company building an identity platform
  that governs both human and AI-agent identities across the enterprise. Its three
  pillars are Identity Discovery (continuously discovering and mapping every identity
  across directories, PAM, shadow systems, and AI infrastructure), Identity Security
  (breach prevention through phishing-resistant authentication and device-bound
  sessions that cannot be stolen or replayed), and Human + AI Agent Governance
  (minimum-access provisioning, full lifecycle management, and support for ephemeral
  agentic workloads). NewCore is backed by Index Ventures. It sells to enterprises via
  demo request and publishes a trust center (SOC 2 Type II, CSA STAR Level 1, GDPR,
  CCPA) but does not currently expose a public developer API, SDKs, or API documentation.
